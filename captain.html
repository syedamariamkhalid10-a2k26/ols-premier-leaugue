<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captain · OLS Premier League</title>
<meta name="theme-color" content="#1B2A4A">
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/css/app.css">
<style>
  body { padding-bottom: 76px; }
  .cap-wrap { max-width: 760px; margin: 0 auto; padding: 14px; }
  .clubbar { --c1: var(--navy); --c2: var(--gold); display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); border-top: 5px solid var(--c1); }
  .clubbar h2 { margin: 0; font-size: 1.45rem; text-transform: uppercase; }
  .money { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .money div { background: #fff; border-radius: 12px; padding: 10px; box-shadow: var(--shadow); text-align: center; }
  .money b { display: block; font: 800 1.7rem/1 var(--display); color: var(--navy); }
  .money span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--g500); font-weight: 700; }
  .lot { background: #fff; border-radius: 16px; box-shadow: var(--shadow); margin-top: 12px; overflow: hidden; }
  .lot-top { display: flex; gap: 14px; padding: 14px; align-items: center; }
  .lot-top .pcard { flex: none; }
  .lot-top h3 { font-size: 1.7rem; margin: 6px 0 4px; text-transform: uppercase; }
  .status { display: inline-flex; font: 700 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px; border-radius: 7px; background: var(--g100); color: var(--g600); }
  .status.open { background: var(--green); color: #fff; } .status.paused { background: #E59A1A; color: #fff; } .status.timeup { background: var(--red); color: #fff; }
  .hb { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--g100); }
  .hb > div { padding: 12px 14px; }
  .hb > div + div { border-left: 1px solid var(--g100); }
  .hb .l { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--g500); font-weight: 700; }
  .hb .v { font: 800 2.2rem/1.05 var(--display); color: var(--navy); }
  .hb .lead { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-weight: 700; }
  .hb .lead.me { color: var(--green); }
  .timerbar { height: 8px; background: var(--g100); position: relative; }
  .timerbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); width: 0; }
  .timerbar.warn i { background: #E59A1A; } .timerbar.end i { background: var(--red); }
  .bidzone { padding: 14px; background: var(--g50); border-top: 1px solid var(--g100); }
  .bidbtn { width: 100%; min-height: 84px; border-radius: 16px; border: 0; font: 800 2.3rem/1 var(--display); letter-spacing: .04em; color: #fff; background: var(--red);
    box-shadow: 0 6px 0 var(--red-dark), 0 10px 24px rgba(226,67,75,.35); cursor: pointer; touch-action: manipulation; transition: transform .06s; }
  .bidbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--red-dark); }
  .bidbtn small { display: block; font: 600 13px/1.2 var(--body); letter-spacing: 0; opacity: .9; margin-top: 4px; }
  .bidbtn:disabled { background: #A4ADBC; box-shadow: 0 6px 0 #8B95A6; cursor: not-allowed; transform: none; }
  .bidbtn.leading:disabled { background: var(--green); box-shadow: 0 6px 0 #0B5E43; opacity: 1; }
  .raise { display: flex; gap: 8px; margin-top: 12px; justify-content: center; flex-wrap: wrap; }
  .raise button { flex: 1; min-width: 70px; }
  .fb { margin-top: 10px; min-height: 22px; text-align: center; font-weight: 700; }
  .fb.ok { color: var(--green); } .fb.err { color: var(--red-dark); }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--g200); display: grid; grid-template-columns: 1fr 1fr; z-index: 40; padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { background: none; border: 0; padding: 12px 6px; font: 700 14px var(--body); color: var(--g500); cursor: pointer; border-top: 3px solid transparent; }
  .tabbar button.active { color: var(--navy); border-color: var(--red); }
  .waiting { padding: 34px 16px; text-align: center; }
  .waiting h3 { text-transform: uppercase; font-size: 1.6rem; }
</style>
</head>
<body>
<div id="top"></div>
<div class="banner-off hidden" id="offline">⚠ Connection lost — reconnecting. Bidding is paused on this device.</div>
<main class="cap-wrap">
  <div class="clubbar" id="clubbar"></div>
  <div class="money" id="money"></div>
  <section id="tab-auction"><div class="lot" id="lot"></div><div class="card mt2" id="mine"></div></section>
  <section id="tab-squad" class="hidden"><div class="card mt2" id="lineup"></div></section>
</main>
<nav class="tabbar"><button class="active" data-tab="auction">Live Auction</button><button data-tab="squad">My Squad</button></nav>
<script src="/socket.io/socket.io.min.js"></script>
<script src="/js/core.js"></script>
<script src="/js/lineup.js"></script>
<script src="/js/captain.js"></script>
</body>
</html>
